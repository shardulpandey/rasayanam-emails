<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Rasayanam Post-Purchase Emails (Draft)</title>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root { --ink: #0E1822; --muted: #4A5568; --line: #DDE5EF; --bg: #EEF2F6; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font-family: Manrope, Helvetica, Arial, sans-serif; }
  header { background: linear-gradient(97deg, #0E1822 30%, #386088 160%); color: #fff; padding: 36px 16px 32px; text-align: center; }
  header h1 { margin: 0 0 8px; font-size: 28px; font-weight: 700; letter-spacing: -0.5px; }
  header p { margin: 0 auto; max-width: 620px; font-size: 15px; line-height: 22px; color: rgba(255,255,255,.78); }
  .tabs { position: sticky; top: 0; z-index: 2; display: flex; justify-content: center; gap: 8px; padding: 12px 16px; background: #fff; border-bottom: 1px solid var(--line); flex-wrap: wrap; }
  .tabs button { padding: 9px 16px; border: 1px solid var(--line); border-radius: 999px; background: #fff; color: var(--ink); font: 600 14px/18px Manrope, sans-serif; cursor: pointer; }
  .tabs button.on { background: var(--ink); border-color: var(--ink); color: #fff; }
  .view { display: flex; justify-content: center; gap: 8px; margin: 18px 16px 0; }
  .view button { padding: 6px 14px; border: 0; border-radius: 6px; background: transparent; color: var(--muted); font: 600 13px/18px Manrope, sans-serif; cursor: pointer; }
  .view button.on { background: #E3EEFF; color: var(--ink); }
  main { display: flex; flex-direction: column; align-items: center; padding: 16px 16px 48px; }
  .meta { max-width: 600px; width: 100%; margin: 0 0 14px; font-size: 14px; line-height: 21px; color: var(--muted); text-align: center; }
  .meta a { color: var(--ink); font-weight: 600; }
  .frame { width: 640px; max-width: 100%; border: 0; background: #EEF2F6; display: block; transition: width .25s ease; }
  .frame.phone { width: 395px; border: 10px solid #1d2530; border-radius: 36px; background: #fff; }
</style>
</head>
<body>
<header>
  <h1>Post-Purchase Emails</h1>
  <p>Draft templates from the Figma, shown with the Figma's sample order. In Shopify the order details, items, prices, address and tracking fill in from each real order.</p>
</header>
<nav class="tabs" role="tablist">
  <button class="on" data-email="order-confirmation" role="tab" aria-selected="true">Order confirmation</button>
  <button data-email="shipped" role="tab" aria-selected="false">Shipped</button>
  <button data-email="out-for-delivery" role="tab" aria-selected="false">Out for delivery</button>
</nav>
<div class="view">
  <button class="on" data-view="desktop">Desktop</button>
  <button data-view="phone">Phone</button>
</div>
<main>
  <p class="meta" id="meta"></p>
  <iframe class="frame" id="frame" title="Email preview" src="order-confirmation.html"></iframe>
</main>
<script>
  var info = {
    'order-confirmation': 'Sent when the order is placed. Shopify: <b>Order confirmation</b>. <a href="order-confirmation.html" target="_blank" rel="noopener">Open on its own</a>',
    'shipped': 'Sent when the order is shipped. Shopify: <b>Shipping confirmation</b>. <a href="shipped.html" target="_blank" rel="noopener">Open on its own</a>',
    'out-for-delivery': 'Sent when the courier is out for delivery. Shopify: <b>Out for delivery</b>. <a href="out-for-delivery.html" target="_blank" rel="noopener">Open on its own</a>'
  };
  var frame = document.getElementById('frame'), meta = document.getElementById('meta');
  function fit() {
    try { frame.style.height = frame.contentDocument.documentElement.scrollHeight + 'px'; } catch (e) { frame.style.height = '2400px'; }
  }
  frame.addEventListener('load', function () { fit(); setTimeout(fit, 600); setTimeout(fit, 1600); });
  function show(name) {
    document.querySelectorAll('[data-email]').forEach(function (b) { var on = b.dataset.email === name; b.classList.toggle('on', on); b.setAttribute('aria-selected', on); });
    meta.innerHTML = info[name];
    frame.src = name + '.html';
    try { history.replaceState(null, '', '#' + name); } catch (e) {}
  }
  document.querySelectorAll('[data-email]').forEach(function (b) { b.addEventListener('click', function () { show(b.dataset.email); }); });
  document.querySelectorAll('[data-view]').forEach(function (b) {
    b.addEventListener('click', function () {
      document.querySelectorAll('[data-view]').forEach(function (x) { x.classList.toggle('on', x === b); });
      frame.classList.toggle('phone', b.dataset.view === 'phone');
      setTimeout(fit, 300);
    });
  });
  var start = (location.hash || '').slice(1);
  show(info[start] ? start : 'order-confirmation');
</script>
</body>
</html>
